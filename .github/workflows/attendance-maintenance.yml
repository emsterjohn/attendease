name: Attendance absence processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-absences:
    runs-on: ubuntu-latest
    steps:
      - name: Process attendance cutoff
        env:
          BASE_URL: \${{ secrets.ATTENDEASE_BASE_URL }}
          CRON_SECRET: \${{ secrets.ATTENDEASE_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add ATTENDEASE_BASE_URL and ATTENDEASE_CRON_SECRET in repository Actions secrets."
            exit 0
          fi
          BASE_URL="\${BASE_URL%/}"
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/tasks/process-absences"
