name: AttendEase code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Check JavaScript syntax
        run: |
          find static/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check Jinja template syntax
        run: |
          python -m pip install Jinja2
          python -c "from pathlib import Path; from jinja2 import Environment; env=Environment(); [env.parse(p.read_text(encoding='utf-8')) for p in Path('templates').rglob('*.html')]"
      - name: Check required app files
        run: |
          test -f app.py
          test -f templates/base.html
          test -f static/js/qr-scanner.js
          test -f requirements.txt
