{% extends "base.html" %}
{% block title %}Initial Setup · AttendEase{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">✓</div>
    <span class="eyebrow">FIRST-TIME SETUP</span>
    <h1 class="h3 fw-bold mt-2">Create administrator</h1>
    <p class="text-secondary">Create the first administrator account to begin using AttendEase.</p>
    <form method="post">
      <label class="form-label">Admin ID</label>
      <input class="form-control mb-3" name="student_id" placeholder="e.g. ADM-001" required>
      <label class="form-label">Full name</label>
      <input class="form-control mb-3" name="full_name" required>
      <label class="form-label">Password</label>
      <input class="form-control mb-3" type="password" name="password" minlength="8" required>
      <label class="form-label">Confirm password</label>
      <input class="form-control mb-4" type="password" name="confirm_password" minlength="8" required>
      <button class="btn btn-primary btn-lg w-100">Create administrator</button>
    </form>
  </div>
</div>
{% endblock %}
